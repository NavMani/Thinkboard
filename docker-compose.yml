version: "3.9"

services:
  backend:
    build:
      context: ./Backend
    container_name: thinkboard-backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    ports: 
      - "5001:5001"


  frontend:
    build:
      context: ./Frontend
    container_name: thinkboard-frontend
    restart: unless-stopped


  nginx:
    image: nginx:alpine
    container_name: thinkboard-nginx
    restart: unless-stopped

    depends_on:
      - frontend
      - backend

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
